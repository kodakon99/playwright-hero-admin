name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # The backend under test: Supabase migrations, seed, edge functions and the
    # static admin app. HERO_REPO_TOKEN is a read-only PAT for that repo.
    - uses: actions/checkout@v4
      with:
        repository: Get-Hero-Now/getheronow-landing-page
        token: ${{ secrets.HERO_REPO_TOKEN }}
        path: hero-backend

    - uses: supabase/setup-cli@v1
      with:
        version: latest

    # supabase start applies migrations + seed.sql, so every run starts from a
    # freshly seeded database (205 waitlist users).
    - name: Start Supabase
      working-directory: hero-backend
      run: |
        echo "ADMIN_EMAIL=admin@example.invalid" > supabase/functions/.env
        supabase start -x studio,imgproxy,vector,logflare

    - name: Serve admin app on :8888
      working-directory: hero-backend
      run: |
        python3 scripts/build-test-site.py
        nohup python3 -m http.server 8888 --directory .test-site > /dev/null 2>&1 &
        curl --retry 10 --retry-connrefused --retry-delay 1 -sf http://localhost:8888/admin.html > /dev/null

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
