name: Playwright Compile Check
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    # The suite targets a local Supabase stack and admin app that CI does not
    # provision, so tests are not executed here. --list compiles every spec,
    # fixture and page object and verifies project/tag routing without running
    # anything or needing a backend.
    - name: Compile and list tests
      run: npx playwright test --list
